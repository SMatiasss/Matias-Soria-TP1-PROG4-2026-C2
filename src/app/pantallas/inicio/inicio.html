<app-header />

<main class="grilla-inicio">
  <!-- Películas más vendidas -->
  <section class="columna">
    <div class="cabecera-columna">
      <h2 class="titulo-columna">Más vendidas</h2>
    </div>
    @if (peliculasMasVendidas().length) {
      <app-mas-vendidas [peliculas]="peliculasMasVendidas()" />
    } @else {
      <app-estado-vacio mensaje="Todavía no hay ventas registradas." />
    }
  </section>

  <!-- Cartelera de inicio -->
  <section class="columna seccion-cartelera-de-inicio">
    <div class="cabecera-columna">
      <h2 class="titulo-columna">Cartelera</h2>
    </div>
    @if (peliculasEnCartelera().length) {
      <div class="tablero-cartelera-de-inicio">
        @for (pelicula of peliculasEnCartelera(); track pelicula.id) {
          <div class="item-cartelera-de-inicio">
            <app-card-pelicula class="tarjeta-con-enlace" [pelicula]="pelicula" [routerLink]="['/pelicula', pelicula.id]" />
            <h3 class="titulo-tarjeta-pelicula" [routerLink]="['/pelicula', pelicula.id]">{{ pelicula.titulo }}</h3>
          </div>
        }
      </div>
      <a class="boton-secundario boton-chico" routerLink="/cartelera">Ver más</a>
    } @else {
      <app-estado-vacio mensaje="No hay películas en cartelera." />
    }
  </section>

  <!-- Próximos estrenos -->
  <section class="columna">
    @if (proximosEstrenos().length) {
      <!-- Carrusel con su cabecera (título y flechas) -->
      <app-carrusel-estrenos
        [peliculas]="proximosEstrenos()"
        [idsPeliculasConAlerta]="idsPeliculasConAlerta()"
        (alertaSolicitada)="activarAlertaDeEstreno($event)"
      />
    } @else {
      <div class="cabecera-columna">
        <h2 class="titulo-columna">Próximamente</h2>
      </div>
      <app-estado-vacio mensaje="No hay estrenos programados por ahora." />
    }
  </section>
</main>
