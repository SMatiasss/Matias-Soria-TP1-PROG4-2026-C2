<app-header seccionActiva="Cartelera" />

<main class="pagina-cartelera">
  <!-- Buscador y filtro por género -->
  <div class="barra-cartelera">
    <h1 class="titulo-cartelera">Cartelera</h1>
    <input
      class="buscador"
      type="text"
      placeholder="Buscar por título"
      [value]="textoBusqueda()"
      (input)="alBuscar($event)"
    />
    <app-selector-chips [opciones]="generosDisponibles()" [(seleccionadas)]="generosSeleccionados" />
  </div>

  <div class="grilla-cartelera">
    @for (p of peliculasFiltradas(); track p.id) {
      <div class="item-cartelera">
        <!-- Si todavía no se estrenó, el póster lleva "Próximamente" -->
        <app-card-pelicula
          class="tarjeta-con-enlace" [pelicula]="p" [routerLink]="['/pelicula', p.id]"
          [proximamente]="idsPeliculasPorEstrenar().includes(p.id)"
        />
        <h3 class="titulo-tarjeta-pelicula" [routerLink]="['/pelicula', p.id]">{{ p.titulo }}</h3>
        <!-- Géneros de la película, no lo tiene la card. -->
        <div class="generos-pelicula">
          @for (genero of p.generos; track genero) {
            <app-badge [texto]="genero" />
          }
        </div>
      </div>
    } @empty {
      @if (hayPeliculas()) {
        <app-estado-vacio mensaje="No hay películas que coincidan con la búsqueda." />
      } @else {
        <app-estado-vacio mensaje="No hay películas." />
      }
    }
  </div>
</main>
