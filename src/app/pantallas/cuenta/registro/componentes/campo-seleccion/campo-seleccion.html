<div class="campo">
  <label [for]="idCampo()">{{ etiqueta() }}</label>
  <select [id]="idCampo()" [formControl]="control()">
    <option value="" disabled>Seleccioná</option>
    @for (opcion of opciones(); track opcion) {
      <option [value]="opcion">{{ opcion }}</option>
    }
  </select>
  <!-- Los mensajes de error los pone el padre adentro del componente (ng-content): se ven cuando se tocó el campo -->
  <p class="error-campo">
    @if (control().touched) {
      <ng-content />
    }
  </p>
</div>
