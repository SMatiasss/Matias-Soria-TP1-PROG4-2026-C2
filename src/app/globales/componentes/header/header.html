<header class="encabezado-sitio">
  <div class="encabezado-izquierda">
    <a class="logo" routerLink="/">
      <span class="logo-allo">allo</span><span class="logo-mund">mund</span>
    </a>
    <nav class="navegacion-sitio">
      <a routerLink="/cartelera" [class.activo]="seccionActiva() === 'Cartelera'">Cartelera</a>
      <!-- La pantalla del rol (Validar QR o Admin), si tiene -->
      @if (enlace(); as enlace) {
        <a [routerLink]="enlace.ruta" [class.activo]="seccionActiva() === enlace.texto">{{ enlace.texto }}</a>
      }
    </nav>
  </div>
  @if (usuarioActual(); as usuario) {
    <div class="cuenta-usuario">
      <a class="nombre-usuario" routerLink="/perfil" [class.activo]="seccionActiva() === 'Perfil'">{{ usuario.nombre }}</a>
      <button type="button" class="boton-secundario boton-chico" (click)="cerrarSesion()">Salir</button>
    </div>
  } @else if (enLogin()) {
    <a class="boton-sesion boton-secundario boton-chico" routerLink="/registro">Registrarse</a>
  } @else {
    <a class="boton-sesion boton-secundario boton-chico" routerLink="/login">Iniciar sesión</a>
  }
</header>
